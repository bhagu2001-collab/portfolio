<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <style>
    img {
      -webkit-user-drag: none;
      user-select: none;
    }
    /* Hide scrollbar for clean look but keep functionality */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-black text-gray-100 min-h-screen no-scrollbar">

  <!-- Floating Timeline Navigation (Right Side) -->
  <nav id="timeline-nav" class="fixed right-6 top-1/2 -translate-y-1/2 z-40 flex flex-col gap-3 text-[10px] tracking-widest text-white/40 font-semibold uppercase pointer-events-auto">
    <!-- Dynamic Month Links will be injected here -->
  </nav>

  <!-- Main Content (Full width with padding to avoid overlapping the timeline nav on the right) -->
  <main class="w-full p-1 pr-20"> <!-- Added padding-right to keep photos away from nav -->
    <!-- Gallery (Masonry) -->
    <div id="gallery" class="columns-1 sm:columns-2 md:columns-3 lg:columns-4 gap-1 space-y-1">
      <!-- Photos dynamically injected -->
    </div>
  </main>

  <!-- Lightbox (Modal) -->
  <div id="lightbox" class="fixed inset-0 z-50 hidden bg-black/98 items-center justify-center p-2 sm:p-4">
    <!-- Close Button -->
    <button id="lightbox-close" class="absolute top-4 right-4 text-white/75 hover:text-white p-2 rounded-full hover:bg-white/10 transition-colors focus:outline-none" aria-label="Close lightbox">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <!-- Lightbox Content Container -->
    <div id="lightbox-content" class="max-w-7xl w-full flex flex-col items-center">
      <div class="relative max-h-[96vh] flex items-center justify-center">
        <img id="lightbox-img" src="" alt="" class="max-w-full max-h-[94vh] object-contain shadow-2xl">
      </div>
    </div>
  </div>

  <!-- Main JS with Cache Buster -->
  <script type="module" src="./app.js?v=3"></script>
</body>
</html>
